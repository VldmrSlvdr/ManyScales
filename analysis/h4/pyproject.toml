[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manyscales-h4"
version = "0.1.0"
description = "Semantic-fidelity measurement pipeline for ManyScales hypothesis 4"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "transformers>=4.40",
]
bayesian = [
    "bambi>=0.14",
    "pymc>=5.16",
]
dev = [
    "pytest>=8.0",
]
figures = [
    "umap-learn>=0.5",
]

[project.scripts]
h4-pipeline = "h4.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
