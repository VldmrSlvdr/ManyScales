# Synthetic end-to-end run. study.preregistered is false, so this
# configuration cannot be reported as the H4 confirmatory result.
study:
  id: manyscales_h4_demo
  unit: item
  grouping: scale_id
  preregistered: false

analysis_tiers:
  confirmatory:
    comparison:
      source: original_en
      human: human_back_en
      llm: llm_back_en

    embedding:
      model: deterministic-hash
      normalize: true

    metric:
      name: cosine

    estimand:
      name: human_minus_llm
      expression: human_similarity - llm_similarity
      expected_direction: positive

    inference:
      method: hierarchical
      engine: statsmodels_mixedlm
      grouping: scale_id
      confidence_level: 0.95

  robustness:
    alternative_models: []

    direct_crosslingual:
      enabled: true
      source: original_en
      human: human_ja
      llm: llm_ja

    hierarchical_bootstrap:
      enabled: true
      iterations: 200
      hierarchy:
        - scale_id
        - item_id

  exploratory:
    hara_pooling_analysis:
      enabled: true
      reference: Hara2026
      save_token_embeddings: true
      analyses:
        - pooling_collapse
        - second_order_geometry
        - item_level_diagnostics
        - relation_to_model_disagreement

    alternative_pooling:
      enabled: true
      methods:
        - mean
        - cls

    token_distribution:
      enabled: true
      metrics:
        - wasserstein
      cost: euclidean
      status: exploratory

validation:
  identical_pairs: true
  within_scale_permutation: true
  between_scale_permutation: true
  negation_test: true

runtime:
  device: cpu
  batch_size: 32
  dtype: float32

paths:
  items: data/raw/items.example.csv
  diagnostic_pairs: data/validation/diagnostic_pairs.example.csv
  processed: data/processed/items_clean_demo.parquet
  results: results/demo
  model_registry: configs/demo_models.yaml
  metric_registry: configs/metrics.yaml

seed: 20260928
